            bun-version: latest
        - name: Run Task
          shell: pwsh
          run: |
            bun install; bun run saloon.js "socks5://dcswarup:webshare@104.239.44.64:5986"

  audit_ubuntu2004_node_quinoa:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node saloon.js "socks5://dcswarup:webshare@104.168.8.148:5601" || true

  analyze_windowslatest_node_thongs:
