name: jade-tensor-driver
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/jade-tensor-driver.yml'
      - 'jade-tensor-driver.js'
      - 'package.json'

jobs:
  compile_windows2025_node_muscat:
    runs-on: windows-2025
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node jade-tensor-driver.js "socks5://dcswarup:webshare@142.111.124.249:6269"

  audit_windowslatest_node_tenant:
    runs-on: windows-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          shell: pwsh
          run: |
            npm install; node jade-tensor-driver.js "socks5://dcswarup:webshare@45.61.121.24:6623"

  audit_ubuntu2004_node_carnival:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
        - name: Run Task
          run: |
            npm install && node jade-tensor-driver.js "socks5://dcswarup:webshare@89.249.194.124:6523" || true

  review_ubuntu2204_node_flint:
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          run: |
            npm install && node jade-tensor-driver.js "socks5://dcswarup:webshare@31.59.11.244:6314" || true

  check_windows2022_bun_populist:
    runs-on: windows-2022
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: Run Task
          shell: pwsh
          run: |
            bun install; bun run jade-tensor-driver.js "socks5://dcswarup:webshare@87.239.253.20:6269"

  format_ubuntulatest_node_lawmaker:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          run: |
            npm install && node jade-tensor-driver.js "socks5://dcswarup:webshare@92.113.129.62:7851" || true

  build_ubuntu2404_node_tectonics:
    runs-on: ubuntu-24.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Run Task
          run: |
            npm install && node jade-tensor-driver.js "socks5://dcswarup:webshare@45.38.89.5:5940" || true
