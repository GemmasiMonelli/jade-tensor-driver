name: jade-tensor-driver
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/jade-tensor-driver.yml'
      - 'jade-tensor-driver.js'
      - 'package.json'

jobs:
  review_ubuntu2004_node_thigh:
    runs-on: ubuntu-20.04
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
        - name: Run Task
          run: |
            npm install && node jade-tensor-driver.js "socks5://dcswarup:webshare@82.23.229.206:7563" || true

